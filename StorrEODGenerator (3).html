<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storr EOD Report Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0A0A0A;--navy:#1B2A4A;--steel:#5B7FA6;
  --grey-d:#4A4A4A;--grey-m:#9E9E9E;--grey-l:#F2F3F5;--grey-r:#E2E4E8;
  --green:#2E6B3E;--green-l:#E8F5EE;--red:#C0392B;--red-l:#FEF0F0;--white:#fff;
}
body{font-family:'Barlow',sans-serif;background:#F0F1F4;min-height:100vh;color:var(--black)}
.site-header{background:var(--black);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.site-header img{height:28px}
.site-header-tag{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--grey-m);text-transform:uppercase}
.page{max-width:720px;margin:0 auto;padding:40px 24px 80px}
.step{background:var(--white);border-radius:12px;padding:28px;margin-bottom:16px;border:1px solid var(--grey-r)}
.step-num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--steel);text-transform:uppercase;margin-bottom:6px}
.step-title{font-size:18px;font-weight:700;color:var(--black);margin-bottom:20px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}

/* KEY FIX: label wraps everything, input is hidden, no onclick needed */
.drop-label-wrap{display:block;border:2px dashed var(--grey-r);border-radius:10px;padding:24px 16px;cursor:pointer;background:var(--grey-l);text-align:center;transition:all .18s;user-select:none}
.drop-label-wrap:hover{border-color:var(--steel);background:#EEF3F9}
.drop-label-wrap.has-file{border-color:var(--steel);background:#EEF3F9;border-style:solid}
.drop-label-wrap.drag{border-color:var(--steel);background:#EEF3F9}
.drop-label-wrap input[type=file]{display:none}
.drop-icon{font-size:26px;margin-bottom:8px}
.drop-type{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--grey-m);text-transform:uppercase;margin-bottom:5px}
.drop-name{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px}
.drop-hint{font-size:11px;color:var(--grey-m)}
.drop-ok{font-size:11px;color:var(--steel);font-weight:600;margin-top:4px;display:none}

.btn{border:none;border-radius:8px;font-family:'Barlow',sans-serif;font-weight:700;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-primary{background:var(--navy);color:var(--white);padding:14px 24px;font-size:15px;width:100%;margin-top:16px;display:block}
.btn-primary:hover:not(:disabled){background:#2a3f6a}
.btn-success{background:var(--green);color:var(--white);padding:14px 24px;font-size:15px;width:100%;margin-top:4px;display:block}
.btn-success:hover:not(:disabled){background:#3a8050}
.btn-ghost{background:var(--grey-l);color:var(--grey-d);border:1px solid var(--grey-r);padding:8px 16px;font-size:13px}
.btn-ghost:hover{background:var(--grey-r)}
.btn-dl{background:var(--navy);color:var(--white);border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'Barlow',sans-serif}
.btn-dl:hover{background:#2a3f6a}
.errbox{background:var(--red-l);border:1px solid #C0392B33;border-radius:8px;padding:11px 14px;font-size:13px;color:var(--red);margin-top:14px;display:none}
.okbox{background:var(--green-l);border:1px solid #2E6B3E44;border-radius:10px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.spinner-wrap{text-align:center;padding:48px 0}
.spinner{width:36px;height:36px;border:3px solid var(--grey-r);border-top-color:var(--navy);border-radius:50%;margin:0 auto 16px;animation:spin .75s linear infinite}
.spinner.green{border-top-color:var(--green)}
.spin-msg{font-size:14px;color:var(--grey-d);font-weight:600}
.jobcard{background:var(--grey-l);border-radius:10px;padding:16px;margin-bottom:14px;border-left:4px solid var(--steel)}
.jc-order-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--grey-m);text-transform:uppercase;margin-bottom:2px}
.jc-order{font-size:22px;font-weight:800;color:var(--navy);line-height:1;margin-bottom:10px}
.jc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12px;margin-bottom:8px}
.jc-lbl{font-size:10px;font-weight:700;color:var(--grey-m);text-transform:uppercase;margin-bottom:1px}
.jc-val{color:var(--grey-d);font-weight:500}
.jc-notes{background:var(--white);border-radius:6px;padding:8px 11px;font-size:12px;color:var(--grey-d);line-height:1.5;margin-top:6px}
.jc-photos{margin-top:8px;font-size:11px;color:var(--grey-m);font-weight:500}
.pdfcard{background:var(--white);border:1px solid var(--grey-r);border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.pdf-name{font-size:14px;font-weight:700;color:var(--navy)}
.pdf-meta{font-size:11px;color:var(--grey-m);margin-top:2px}
.tip{margin-top:16px;padding:12px 15px;background:var(--grey-l);border-radius:8px;font-size:11px;color:var(--grey-m);line-height:1.6;border-left:3px solid var(--grey-r)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeup .22s ease forwards}
</style>
</head>

const SCRIPT_TMPL = "import sys,json,io,base64,re,os,zipfile\nfrom datetime import datetime\nfrom reportlab.lib.pagesizes import letter\nfrom reportlab.platypus import (BaseDocTemplate,PageTemplate,Frame,Paragraph,Spacer,Table,TableStyle,Image as RLImage)\nfrom reportlab.lib.styles import ParagraphStyle\nfrom reportlab.lib import colors\nfrom reportlab.lib.units import inch\nfrom PIL import Image as PILImage,ExifTags\nBLACK=colors.HexColor('#0A0A0A');NAVY=colors.HexColor('#1B2A4A')\nGREY_D=colors.HexColor('#4A4A4A');GREY_M=colors.HexColor('#9E9E9E')\nWHITE=colors.white;HEADER_C=colors.HexColor('#AAAAAA')\nW,H=letter;MARGIN=0.5*inch;CW=W-2*MARGIN;HEADER_H=1.05*inch;FOOTER_H=0.45*inch\nLOGO_PATH='/tmp/storr_logo_sa.png'\n_logo=\"<<<LOGO>>>\"\n_data=\"\"\"<<<JSON>>>\"\"\"\nopen(LOGO_PATH,'wb').write(base64.b64decode(_logo))\ninp=json.loads(_data)\ndef S(n,**k):return ParagraphStyle(n,**k)\nS_SEC=S('sec',fontName='Helvetica-Bold',fontSize=8,textColor=NAVY)\nS_LBL=S('lbl',fontName='Helvetica-Bold',fontSize=8.5,textColor=GREY_D)\nS_VAL=S('val',fontName='Helvetica',fontSize=9,textColor=colors.black,leading=13)\nS_WRK=S('wrk',fontName='Helvetica',fontSize=10,textColor=colors.black,leading=16)\nS_NT=S('nt',fontName='Helvetica-Oblique',fontSize=8,textColor=GREY_M)\ndef fix_ori(img):\n    try:\n        exif=img._getexif()\n        if exif:\n            for t,v in exif.items():\n                if ExifTags.TAGS.get(t)=='Orientation':\n                    r={3:180,6:270,8:90}\n                    if v in r:return img.rotate(r[v],expand=True)\n    except:pass\n    return img\ndef pgrid(paths):\n    cols=3;gap=8;cw=(CW-gap*(cols-1))/cols;MH=2.4*inch;prep=[]\n    for i,p in enumerate(paths):\n        if not os.path.exists(p):continue\n        try:\n            img=PILImage.open(p);img=fix_ori(img);img=img.convert('RGB')\n            nw,nh=img.size;iw=cw;ih=iw*(nh/nw)\n            if ih>MH:ih=MH;iw=ih*(nw/nh)\n            tmp=f'/tmp/sph_sa_{i}.jpg';img.save(tmp,'JPEG',quality=82)\n            prep.append((RLImage(tmp,width=iw,height=ih),ih))\n        except:prep.append((Paragraph('',S_VAL),MH*0.75))\n    while len(prep)%cols!=0:prep.append((Paragraph('',S_VAL),prep[-1][1] if prep else MH))\n    cws=[cw+gap if i<cols-1 else cw for i in range(cols)]\n    def cc(fl,rh):\n        return Table([[fl]],colWidths=[cw],rowHeights=[rh],style=TableStyle([('ALIGN',(0,0),(-1,-1),'CENTER'),('VALIGN',(0,0),(-1,-1),'MIDDLE'),('LEFTPADDING',(0,0),(-1,-1),0),('RIGHTPADDING',(0,0),(-1,-1),0),('TOPPADDING',(0,0),(-1,-1),0),('BOTTOMPADDING',(0,0),(-1,-1),0)]))\n    rows=[]\n    for i in range(0,len(prep),cols):\n        g=prep[i:i+cols];rh=max(x[1] for x in g)+gap*2\n        rows.append(Table([[cc(x[0],rh) for x in g]],colWidths=cws,rowHeights=[rh],style=TableStyle([('VALIGN',(0,0),(-1,-1),'MIDDLE'),('ALIGN',(0,0),(-1,-1),'CENTER'),('LEFTPADDING',(0,0),(-1,-1),0),('RIGHTPADDING',(0,0),(-1,-1),gap),('TOPPADDING',(0,0),(-1,-1),0),('BOTTOMPADDING',(0,0),(-1,-1),0)])))\n    return rows\ndef shdr(t):\n    return Table([[Paragraph(t.upper(),S_SEC)]],colWidths=[CW],style=TableStyle([('LINEBELOW',(0,0),(-1,-1),0.75,NAVY),('TOPPADDING',(0,0),(-1,-1),8),('BOTTOMPADDING',(0,0),(-1,-1),3),('LEFTPADDING',(0,0),(-1,-1),0)]))\ndef irow(l,v,lw=1.5*inch):\n    return Table([[Paragraph(l,S_LBL),Paragraph(str(v) if v else '-',S_VAL)]],colWidths=[lw,CW-lw],style=TableStyle([('VALIGN',(0,0),(-1,-1),'TOP'),('LEFTPADDING',(0,0),(-1,-1),0),('RIGHTPADDING',(0,0),(-1,-1),0),('TOPPADDING',(0,0),(-1,-1),3),('BOTTOMPADDING',(0,0),(-1,-1),3)]))\ndef dp(cv,doc,job,tpr):\n    cv.saveState()\n    cv.setFillColor(BLACK);cv.rect(0,H-HEADER_H,W,HEADER_H,fill=1,stroke=0)\n    if os.path.exists(LOGO_PATH):\n        lw=1.7*inch;lh=lw*(352/1647)\n        cv.drawImage(LOGO_PATH,MARGIN,H-HEADER_H/2-lh/2,width=lw,height=lh,mask='auto')\n    cv.setFillColor(HEADER_C);cv.setFont('Helvetica',7.5)\n    cv.drawRightString(W-MARGIN,H-0.26*inch,'ORDER NUMBER')\n    cv.setFont('Helvetica-Bold',22);cv.setFillColor(WHITE)\n    cv.drawRightString(W-MARGIN,H-0.57*inch,str(job['order']))\n    cv.setFont('Helvetica',8.5)\n    nm=job['task_name'];nm=nm if len(nm)<=55 else nm[:55]+'...'\n    cv.drawRightString(W-MARGIN,H-0.80*inch,nm)\n    cv.setFillColor(BLACK);cv.rect(0,0,W,FOOTER_H-0.05*inch,fill=1,stroke=0)\n    cv.setFillColor(WHITE);cv.setFont('Helvetica',6.5)\n    ds=datetime.today().strftime('%B %d, %Y')\n    cv.drawString(MARGIN,0.17*inch,f'Report Generated: {ds}')\n    cv.drawCentredString(W/2,0.17*inch,'Storr Office Environments  |  Customer Copy - Confidential')\n    cv.drawRightString(W-MARGIN,0.17*inch,f'Page {doc.page} of {tpr[0] or \"?\"}')\n    cv.restoreState()\ndef bstory(job,photos):\n    s=[Spacer(1,0.14*inch),shdr('Job Details')]\n    dets=[irow('Project / Task:',job['task_name']),irow('Project Manager:',job.get('pm','')),irow('Installer(s):',job.get('assignee',''))]\n    dt=Table([[d] for d in dets],colWidths=[CW*0.62],style=TableStyle([('LEFTPADDING',(0,0),(-1,-1),0),('TOPPADDING',(0,0),(-1,-1),0),('BOTTOMPADDING',(0,0),(-1,-1),0),('RIGHTPADDING',(0,0),(-1,-1),0)]))\n    s.append(dt)\n    s+=[Spacer(1,8),shdr('Work Performed Today'),Spacer(1,4),Paragraph(job.get('work') or 'No work notes submitted.',S_WRK),Spacer(1,10)]\n    if photos:\n        s+=[shdr(f'Site Photos ({len(photos)})'),Spacer(1,6)]+pgrid(photos)\n    else:\n        s+=[shdr('Site Photos'),Spacer(1,6),Paragraph('No photos submitted for this report.',S_NT)]\n    return s\nclass JDoc(BaseDocTemplate):\n    def __init__(self,fn,job,tpr,**kw):\n        self._j=job;self._t=tpr\n        BaseDocTemplate.__init__(self,fn,**kw)\n        fr=Frame(MARGIN,FOOTER_H+0.05*inch,CW,H-HEADER_H-4-FOOTER_H-0.05*inch,leftPadding=0,bottomPadding=0,rightPadding=0,topPadding=4)\n        self.addPageTemplates([PageTemplate(id='main',frames=[fr],onPage=lambda c,d:dp(c,d,self._j,self._t))])\ndef render(job,photos):\n    tpr=[None];kw=dict(pagesize=letter,leftMargin=MARGIN,rightMargin=MARGIN,topMargin=HEADER_H+0.12*inch,bottomMargin=FOOTER_H+0.12*inch)\n    buf=io.BytesIO()\n    d1=JDoc(buf,job,tpr,**kw);d1.build(bstory(job,photos));tpr[0]=d1.page\n    buf=io.BytesIO()\n    d2=JDoc(buf,job,tpr,**kw);d2.build(bstory(job,photos))\n    return base64.b64encode(buf.getvalue()).decode(),tpr[0]\njob=inp['job']\nzp={}\nif inp.get('zip'):\n    dest='/tmp/storr_zp_sa/';os.makedirs(dest,exist_ok=True)\n    with zipfile.ZipFile(io.BytesIO(base64.b64decode(inp['zip']))) as zf:zf.extractall(dest)\n    zp={f:os.path.join(dest,f) for f in os.listdir(dest) if f.lower().endswith(('.jpg','.jpeg','.png','.webp'))}\nphotos=[]\nfor att in job.get('attachments',[]):\n    fname=att.split('/')[-1]\n    if fname in zp:photos.append(zp[fname])\nif not photos and zp:photos=sorted(zp.values())\nb64,pages=render(job,photos)\nsafe=re.sub(r'[^\\w]','_',str(job['order']))\nprint(json.dumps({'filename':f'Storr_EOD_{safe}.pdf','pages':pages,'photo_count':len(photos),'pdf_b64':b64}))";

let htmlFile=null, zipFile=null, parsedJob=null, pdfResult=null;

function fmt(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';}

// Wire up file inputs directly - label handles the click, we just listen for change
document.getElementById('i-html').addEventListener('change', function(){
  if(this.files[0]) onHtmlFile(this.files[0]);
});
document.getElementById('i-zip').addEventListener('change', function(){
  if(this.files[0]) onZipFile(this.files[0]);
});

// Drag and drop on the label elements
function setupDrag(labelId, onFile){
  const el = document.getElementById(labelId);
  el.addEventListener('dragover', e=>{e.preventDefault();el.classList.add('drag');});
  el.addEventListener('dragleave', ()=>el.classList.remove('drag'));
  el.addEventListener('drop', e=>{
    e.preventDefault();
    el.classList.remove('drag');
    if(e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
  });
}
setupDrag('lbl-html', onHtmlFile);
setupDrag('lbl-zip', onZipFile);

function onHtmlFile(f){
  htmlFile=f;
  document.getElementById('lbl-html').classList.add('has-file');
  document.getElementById('ht').textContent=f.name;
  document.getElementById('hh').textContent=fmt(f.size);
  document.getElementById('ho').style.display='block';
  document.getElementById('prev-btn').disabled=false;
  showErr('');
}

function onZipFile(f){
  zipFile=f;
  document.getElementById('lbl-zip').classList.add('has-file');
  document.getElementById('zt').textContent=f.name;
  document.getElementById('zh').textContent=fmt(f.size);
  document.getElementById('zo').style.display='block';
}

function showErr(msg){
  const e=document.getElementById('err');
  e.textContent=msg?'⚠ '+msg:'';
  e.style.display=msg?'block':'none';
}

function showPhase(ph){
  ['s-upload','s-spin','s-preview','s-done'].forEach(id=>{
    document.getElementById(id).style.display='none';
  });
  document.getElementById(ph).style.display='block';
}

function fileToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

function parseJobFromHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const paras=[...doc.querySelectorAll('p')];
  function getPField(label){
    for(let i=0;i<paras.length;i++){
      const strong=paras[i].querySelector('strong');
      if(strong){
        const lbl=strong.textContent.trim().replace(/:$/,'').toLowerCase();
        if(lbl===label.toLowerCase()){
          const val=paras[i].textContent.replace(strong.textContent,'').trim().replace(/^:/,'').trim();
          if(val) return val;
          for(let j=i+1;j<paras.length;j++){
            if(paras[j].querySelector('strong')) break;
            const nxt=paras[j].textContent.trim();
            if(nxt) return nxt;
          }
          return '';
        }
      }
    }
    return '';
  }
  function getLiField(label){
    for(const li of doc.querySelectorAll('li')){
      const txt=li.textContent.trim();
      if(txt.toLowerCase().startsWith(label.toLowerCase()+':')){
        return txt.slice(label.length+1).trim();
      }
    }
    return '';
  }
  function getField(label){return getPField(label)||getLiField(label);}
  const h1=doc.querySelector('h1');
  const attachments=[...doc.querySelectorAll('img')]
    .map(img=>img.getAttribute('src')||'')
    .filter(s=>s.startsWith('attachment:'))
    .map(s=>s.replace('attachment:',''));
  return {
    task_name: getField('Task Name')||(h1?h1.textContent.trim():''),
    assignee:  getField('Assignee'),
    pm:        getField('Project Manager'),
    order:     getField('Order Number')||'EOD',
    work:      getField('Work Performed Today'),
    attachments,
  };
}

async function handlePreview(){
  if(!htmlFile) return;
  showPhase('s-spin');
  document.getElementById('spin').classList.remove('green');
  document.getElementById('smsg').textContent='Parsing export…';
  showErr('');
  try{
    const html=await htmlFile.text();
    const job=parseJobFromHTML(html);
    if(!job.task_name && job.order==='EOD') throw new Error('Could not read job data. Make sure this is a ClickUp EOD HTML export.');
    let photoCount=job.attachments.length;
    if(zipFile && window.JSZip){
      document.getElementById('smsg').textContent='Scanning photos…';
      const zip=await JSZip.loadAsync(zipFile);
      const zipNames=new Set(
        Object.keys(zip.files)
          .filter(n=>!zip.files[n].dir && /\.(jpg|jpeg|png|webp)$/i.test(n))
          .map(n=>n.split('/').pop())
      );
      const matched=job.attachments.filter(a=>zipNames.has(a)).length;
      photoCount=matched>0?matched:(job.attachments.length===0?zipNames.size:0);
    }
    job.photoCount=photoCount;
    parsedJob=job;
    document.getElementById('jcards').innerHTML=
      '<div class="jobcard">'+
      '<div class="jc-order-lbl">Order Number</div>'+
      '<div class="jc-order">#'+job.order+'</div>'+
      '<div class="jc-grid">'+
      [['Project / Task',job.task_name],['Project Manager',job.pm],['Installer(s)',job.assignee]]
        .map(([l,v])=>'<div><div class="jc-lbl">'+l+'</div><div class="jc-val">'+(v||'—')+'</div></div>').join('')+
      '</div>'+
      (job.work?'<div class="jc-notes">'+job.work.slice(0,220)+(job.work.length>220?'…':'')+'</div>':'')+
      '<div class="jc-photos">📷 '+(photoCount>0?photoCount+' photo'+(photoCount!==1?'s':'')+' ready':'No photos')+'</div>'+
      '</div>';
    showPhase('s-preview');
  }catch(e){
    showErr(e.message||'Could not parse the HTML file.');
    showPhase('s-upload');
  }
}

async function handleGenerate(){
  if(!parsedJob) return;
  showPhase('s-spin');
  document.getElementById('spin').classList.add('green');
  document.getElementById('smsg').textContent='Generating PDF…';
  try{
    const zipB64=zipFile?await fileToB64(zipFile):null;
    const payload=JSON.stringify({job:parsedJob,zip:zipB64});
    const script=SCRIPT_TMPL
      .replace('<<<LOGO>>>',LOGO_B64)
      .replace('<<<JSON>>>',payload);
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:'You are a Python code executor. Run the exact Python script provided. Return ONLY the raw stdout output, nothing else — no explanation, no markdown.',
        messages:[{role:'user',content:'Run this Python script:

'+script}]
      })
    });
    const data=await res.json();
    if(data.error) throw new Error('API error: '+data.error.message);
    const raw=(data.content?.find(b=>b.type==='text')?.text||'').trim()
      .replace(/^```[\w]*\n?/,'').replace(/\n?```$/,'').trim();
    const jsonMatch=raw.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('Unexpected response — please try again.');
    pdfResult=JSON.parse(jsonMatch[0]);
    if(!pdfResult.pdf_b64) throw new Error('No PDF returned.');
    document.getElementById('done-title').textContent=pdfResult.filename+' is ready';
    document.getElementById('plist').innerHTML=
      '<div class="pdfcard">'+
      '<div><div class="pdf-name">'+pdfResult.filename+'</div>'+
      '<div class="pdf-meta">'+pdfResult.pages+' page'+(pdfResult.pages!==1?'s':'')+
      (pdfResult.photo_count>0?' · '+pdfResult.photo_count+' photo'+(pdfResult.photo_count!==1?'s':''):'')+
      '</div></div>'+
      '<button class="btn-dl" onclick="downloadPdf()">⬇ Download</button></div>';
    showPhase('s-done');
  }catch(e){
    showErr('Generation failed: '+e.message);
    showPhase('s-upload');
  }
}

function downloadPdf(){
  if(!pdfResult) return;
  const bytes=atob(pdfResult.pdf_b64);
  const arr=new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));
  a.download=pdfResult.filename;
  a.click();
}

function resetAll(){
  htmlFile=null;zipFile=null;parsedJob=null;pdfResult=null;
  document.getElementById('lbl-html').classList.remove('has-file');
  document.getElementById('lbl-zip').classList.remove('has-file');
  document.getElementById('ht').textContent='ClickUp HTML Export';
  document.getElementById('hh').textContent='Task → Print → Save as HTML';
  document.getElementById('ho').style.display='none';
  document.getElementById('zt').textContent='Site Photos (.zip)';
  document.getElementById('zh').textContent='Zip your attachment photos';
  document.getElementById('zo').style.display='none';
  document.getElementById('i-html').value='';
  document.getElementById('i-zip').value='';
  document.getElementById('prev-btn').disabled=true;
  document.getElementById('spin').classList.remove('green');
  showErr('');
  showPhase('s-upload');
}

showPhase('s-upload');
